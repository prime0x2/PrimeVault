<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PrimeVault CWS frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 800px; font-family: 'Geist', system-ui, sans-serif; background: #06080a; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const ACCENT = '#5fdc89';
  const params = new URLSearchParams(location.search);

  // Required: popup image URL (file:// is fine), shot index, eyebrow/headline/sub.
  const popupUrl = params.get('popup');
  const index = params.get('index') || '01';
  const total = params.get('total') || '05';
  const eyebrow = params.get('eyebrow') || '';
  const headline = params.get('headline') || '';
  const sub = params.get('sub') || '';
  // Popup natural dimensions (so we can letterbox without scaling artefacts).
  const popupW = parseInt(params.get('w') || '380', 10);
  const popupH = parseInt(params.get('h') || '560', 10);

  function dialMark(size, ringColor, accentColor) {
    const cx = 40, cy = 40;
    const ticks = [];
    for (let i = 0; i < 36; i++) {
      const a = (i / 36) * Math.PI * 2 - Math.PI / 2;
      const isMajor = i % 9 === 0;
      const r1 = isMajor ? 32 : 35;
      const r2 = 38;
      ticks.push(`<line x1="${cx + Math.cos(a) * r1}" y1="${cy + Math.sin(a) * r1}" x2="${cx + Math.cos(a) * r2}" y2="${cy + Math.sin(a) * r2}" stroke="${ringColor}" stroke-width="${isMajor ? 1.2 : 0.7}" opacity="${isMajor ? 0.9 : 0.4}" />`);
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      ${ticks.join('')}
      <circle cx="${cx}" cy="${cy}" r="29" stroke="${ringColor}" stroke-width="1.1" fill="none" />
      <circle cx="${cx}" cy="${cy}" r="20" stroke="${accentColor}" stroke-width="1.6" fill="none" />
      <circle cx="${cx}" cy="${cy}" r="11" stroke="${ringColor}" stroke-width="0.9" opacity="0.5" fill="none" />
      <line x1="${cx}" y1="6" x2="${cx}" y2="14" stroke="${accentColor}" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="${cx}" cy="${cy}" r="2.6" fill="${accentColor}" />
    </svg>`;
  }

  // Right-column container is 580px wide, body height ≈ 660px (header 80, body
  // 660, footer 60). Scale popup down only if it overflows; never scale up.
  const RIGHT_W = 580;
  const RIGHT_H = 660;
  const fitScale = Math.min(1, RIGHT_W / popupW, RIGHT_H / popupH);
  const renderW = popupW * fitScale;
  const renderH = popupH * fitScale;

  const cornerMarks = [
    { top: 24, left: 24, rot: 0 },
    { top: 24, right: 24, rot: 90 },
    { bottom: 24, right: 24, rot: 180 },
    { bottom: 24, left: 24, rot: 270 },
  ].map((p) => {
    const pos = Object.entries(p).filter(([k]) => k !== 'rot').map(([k, v]) => `${k}:${v}px`).join(';');
    return `<svg width="18" height="18" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" style="position:absolute;${pos};transform:rotate(${p.rot}deg);"><path d="M2 2H10M2 2V10" stroke="rgba(120,255,150,0.35)" stroke-width="1" /></svg>`;
  }).join('');

  const html = `
    <div style="width:1280px;height:800px;background:radial-gradient(ellipse at 70% 50%, #11160e 0%, #06080a 70%);position:relative;overflow:hidden;color:#e6f0e6;">
      <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(120,255,150,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(120,255,150,0.04) 1px, transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 70% 50%, black 0%, transparent 75%);mask-image:radial-gradient(ellipse at 70% 50%, black 0%, transparent 75%);"></div>
      ${cornerMarks}

      <!-- Header strip -->
      <div style="position:absolute;top:0;left:0;right:0;height:80px;padding:0 64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(120,255,150,0.08);">
        <div style="display:flex;align-items:center;gap:12px;">
          ${dialMark(28, 'rgba(230,240,230,0.85)', ACCENT)}
          <span style="font-size:18px;font-weight:600;letter-spacing:-0.01em;">PrimeVault</span>
        </div>
        <div style="font-family:'Geist Mono';font-size:12px;color:#7d8a7d;letter-spacing:0.24em;text-transform:uppercase;">${index} / ${total}</div>
      </div>

      <!-- Body: copy left, popup right -->
      <div style="position:absolute;top:80px;left:0;right:0;bottom:60px;display:flex;align-items:center;">
        <div style="width:580px;padding:0 64px;flex-shrink:0;">
          <div style="font-family:'Geist Mono';font-size:13px;color:${ACCENT};letter-spacing:0.28em;text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:10px;">
            <span>›</span><span>${eyebrow}</span>
          </div>
          <h1 style="font-size:54px;font-weight:600;letter-spacing:-0.025em;margin:0;line-height:1.05;color:#e6f0e6;white-space:pre-line;">${headline}</h1>
          <p style="font-size:18px;color:#a8b3a8;line-height:1.55;margin:24px 0 0;max-width:440px;font-weight:400;">${sub}</p>
        </div>
        <div style="flex:1;height:100%;display:flex;align-items:center;justify-content:center;position:relative;">
          <!-- Glow under popup -->
          <div style="position:absolute;width:${renderW}px;height:${renderH}px;background:radial-gradient(circle, rgba(120,255,150,0.18) 0%, transparent 65%);filter:blur(40px);"></div>
          <!-- Popup, with rounded corners + drop shadow to read as a floating UI -->
          <img src="${popupUrl}" width="${renderW}" height="${renderH}"
               style="border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(120,255,150,0.12);position:relative;" />
        </div>
      </div>

      <!-- Footer strip -->
      <div style="position:absolute;left:0;right:0;bottom:0;height:60px;padding:0 64px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(120,255,150,0.08);font-family:'Geist Mono';font-size:12px;color:#525c52;letter-spacing:0.16em;text-transform:uppercase;">
        <span>local-only · zero-knowledge · open source</span>
        <span>github.com/prime0x2/PrimeVault</span>
      </div>
    </div>`;

  document.getElementById('root').innerHTML = html;

  // Wait for the popup image AND fonts before signaling ready.
  const img = document.querySelector('img');
  const imgReady = new Promise((resolve) => {
    if (img.complete) resolve();
    else { img.onload = resolve; img.onerror = resolve; }
  });
  Promise.all([document.fonts.ready, imgReady]).then(() => {
    requestAnimationFrame(() => { document.body.dataset.ready = 'true'; });
  });
</script>
</body>
</html>
