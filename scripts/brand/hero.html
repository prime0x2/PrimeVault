<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PrimeVault README hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 360px; font-family: 'Geist', system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const ACCENT = '#5fdc89';
  const EMBER = '#db5c39';
  const LIGHT_INK = '#1a1a1a';
  const variant = new URLSearchParams(location.search).get('variant') || 'dark';
  const dark = variant === 'dark';

  const text = dark ? '#e6f0e6' : LIGHT_INK;
  const dim = dark ? '#7d8a7d' : '#6b6b6b';
  const accent = dark ? ACCENT : EMBER;

  function dialMark(size, ringColor, accentColor) {
    const cx = 40, cy = 40;
    const ticks = [];
    for (let i = 0; i < 36; i++) {
      const a = (i / 36) * Math.PI * 2 - Math.PI / 2;
      const isMajor = i % 9 === 0;
      const r1 = isMajor ? 32 : 35;
      const r2 = 38;
      ticks.push(`<line x1="${cx + Math.cos(a) * r1}" y1="${cy + Math.sin(a) * r1}" x2="${cx + Math.cos(a) * r2}" y2="${cy + Math.sin(a) * r2}" stroke="${ringColor}" stroke-width="${isMajor ? 1.2 : 0.7}" opacity="${isMajor ? 0.9 : 0.4}" />`);
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      ${ticks.join('')}
      <circle cx="${cx}" cy="${cy}" r="29" stroke="${ringColor}" stroke-width="1.1" fill="none" />
      <circle cx="${cx}" cy="${cy}" r="20" stroke="${accentColor}" stroke-width="1.6" fill="none" />
      <circle cx="${cx}" cy="${cy}" r="11" stroke="${ringColor}" stroke-width="0.9" opacity="0.5" fill="none" />
      <line x1="${cx}" y1="6" x2="${cx}" y2="14" stroke="${accentColor}" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="${cx}" cy="${cy}" r="2.6" fill="${accentColor}" />
    </svg>`;
  }

  const features = ['local-only', 'zero-knowledge', 'encrypted backup', 'no telemetry'];
  const pills = features.map((f) =>
    `<span style="font-family:${dark ? "'Geist Mono'" : "'Geist'"};font-size:12.5px;padding:5px 11px;border:${dark ? '1px solid rgba(120,255,150,0.18)' : '1px solid rgba(0,0,0,0.12)'};background:${dark ? 'rgba(120,255,150,0.05)' : 'rgba(0,0,0,0.02)'};color:${dark ? '#c8d4c8' : '#3a3a3a'};border-radius:999px;font-weight:500;">${f}</span>`
  ).join('');

  const gridLayer = !dark
    ? `<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 80% 50%, black 0%, transparent 70%);mask-image:radial-gradient(ellipse at 80% 50%, black 0%, transparent 70%);"></div>`
    : '';

  const tileBg = dark ? '#07090a' : EMBER;
  const tileRadius = dark ? '40px' : '50%';
  const tileBorder = dark ? '1px solid rgba(120,255,150,0.12)' : 'none';
  const tileShadow = dark
    ? '0 18px 48px -16px rgba(0,0,0,0.8)'
    : '0 18px 48px -16px rgba(219,92,57,0.55)';
  const markRing = dark ? 'rgba(230,240,230,0.85)' : 'rgba(255,255,255,0.95)';
  const markAccent = dark ? ACCENT : '#ffffff';

  const html = `
    <div style="width:1280px;height:360px;background:${dark ? 'radial-gradient(ellipse at 80% 50%, #11160e 0%, #06080a 70%)' : '#fefefe'};position:relative;overflow:hidden;color:${text};">
      ${gridLayer}
      <div style="position:absolute;inset:0;padding:60px 72px;display:flex;align-items:center;gap:60px;">
        <div style="width:220px;height:220px;border-radius:${tileRadius};background:${tileBg};display:flex;align-items:center;justify-content:center;flex-shrink:0;border:${tileBorder};box-shadow:${tileShadow};">
          ${dialMark(170, markRing, markAccent)}
        </div>
        <div style="flex:1;">
          <div style="font-family:'Geist Mono';font-size:12px;color:${accent};letter-spacing:0.26em;text-transform:uppercase;margin-bottom:14px;font-weight:500;">Open source · chrome extension</div>
          <h1 style="font-size:76px;font-weight:600;letter-spacing:-0.035em;margin:0;line-height:1;color:${text};">PrimeVault</h1>
          <p style="font-size:20px;color:${dim};line-height:1.45;margin:16px 0 0;max-width:640px;font-weight:400;">A local-only, zero-knowledge vault for the secrets you'd rather not paste into Notes.</p>
          <div style="margin-top:22px;display:flex;gap:8px;flex-wrap:wrap;">${pills}</div>
        </div>
      </div>
    </div>`;

  document.getElementById('root').innerHTML = html;

  document.fonts.ready.then(() => {
    requestAnimationFrame(() => { document.body.dataset.ready = 'true'; });
  });
</script>
</body>
</html>
